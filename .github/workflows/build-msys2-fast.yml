name: Fast Build chiaki-ng Windows (MSYS2)

on:
  workflow_dispatch:
  push:
    branches:
      
    paths:
      - 'gui/**'
      - 'lib/**'
      - 'CMakeLists.txt'
      - '.github/workflows/build-msys2-fast.yml'

jobs:
  build-windows-fast:
    name: Fast Windows x64 Build
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CMAKE_BUILD_PARALLEL_LEVEL: 12
      
    steps:
      - name: Disable autocrlf
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
          
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: mingw64
          update: true
          install: >-
            git
            make
            unzip
            zip
          pacboy: >-
            ca-certificates:p
            cc:p
            ccache:p
            cmake:p
            curl:p
            diffutils:p
            fast_float:p
            fftw:p
            hidapi:p
            json-c:p
            lcms2:p
            libdovi:p
            meson:p
            miniupnpc:p
            gcc:p
            nasm:p
            ninja:p
            openssl:p
            opus:p
            pkgconf:p
            protobuf:p
            python:p
            python-psutil:p
            python-glad:p
            python-jinja:p
            python-pip:p
            qt6-base:p
            qt6-declarative:p
            qt6-svg:p
            qt6-tools:p
            SDL2:p
            shaderc:p
            speexdsp:p
            spirv-cross:p
            vulkan:p
            vulkan-headers:p
            
      # Кэш для Python пакетов
      - name: Cache Python packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-
            
      - name: Install Python dependencies
        run: |
          pip install protobuf
          
      # Кэш для libplacebo
      - name: Cache libplacebo
        id: cache-libplacebo
        uses: actions/cache@v4
        with:
          path: /mingw64/lib/libplacebo*
          key: libplacebo-${{ runner.os }}-${{ hashFiles('scripts/build-libplacebo-windows.sh') }}
          
      - name: Build libplacebo
        if: steps.cache-libplacebo.outputs.cache-hit != 'true'
        run: |
          scripts/build-libplacebo-windows.sh
          
      # Кэш для FFmpeg
      - name: Cache FFmpeg
        id: cache-ffmpeg
        uses: actions/cache@v4
        with:
          path: |
            /mingw64/bin/avcodec*.dll
            /mingw64/bin/avformat*.dll
            /mingw64/bin/avutil*.dll
            /mingw64/bin/swscale*.dll
            /mingw64/bin/swresample*.dll
            /mingw64/include/libav*
            /mingw64/lib/libav*
            /mingw64/lib/pkgconfig/libav*
          key: ffmpeg-7.1-${{ runner.os }}
          
      - name: Setup FFmpeg
        if: steps.cache-ffmpeg.outputs.cache-hit != 'true'
        run: |
          curl -LO https://github.com/streetpea/FFmpeg-Builds/releases/download/latest/ffmpeg-n7.1-latest-win64-gpl-shared-7.1.zip
          unzip -q ffmpeg-n7.1-latest-win64-gpl-shared-7.1.zip
          cp -a "ffmpeg-n7.1-latest-win64-gpl-shared-7.1/bin/." /mingw64/bin
          cp -a "ffmpeg-n7.1-latest-win64-gpl-shared-7.1/include/." /mingw64/include
          cp -a "ffmpeg-n7.1-latest-win64-gpl-shared-7.1/lib/." /mingw64/lib
          
      # Кэш для CMake build (частичный)
      - name: Cache CMake build
        uses: actions/cache@v4
        with:
          path: |
            build/third-party
            build/lib
          key: cmake-build-${{ runner.os }}-${{ hashFiles('third-party/**', 'lib/**') }}
          restore-keys: |
            cmake-build-${{ runner.os }}-
            
      - name: Configure chiaki-ng
        run: |
          cmake -S . -B build -G "Ninja" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCHIAKI_ENABLE_CLI=OFF \
            -DCMAKE_PREFIX_PATH="/mingw64" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
            
      - name: Build chiaki-ng (parallel)
        run: |
          cmake --build build --config Release --target chiaki -j 12
          
      - name: Prepare artifacts
        run: |
          mkdir chiaki-ng-Win
          cp build/gui/chiaki.exe chiaki-ng-Win/
          
      - name: Collect dependencies
        run: |
          export PATH="${{ github.workspace }}/build/third-party/cpp-steam-tools:/mingw64/share/qt6/bin/:${PATH}"
          export QT_PLUGIN_PATH="/mingw64/share/qt6/plugins"
          export QML2_IMPORT_PATH="/mingw64/share/qt6/qml"
          
          echo "Copying DLL dependencies..."
          echo chiaki-ng-Win/chiaki.exe > tmp0.txt
          while [ -e tmp0.txt ]; do
            cp tmp0.txt tmp.txt
            rm tmp0.txt
            sort -u tmp.txt -o tmp.txt
            ldd $(<tmp.txt) | grep -v ":" | cut -d " " -f3 | grep -iv "system32" | grep -iv "not" | xargs -d $'\n' sh -c 'for arg do if [ -n "$arg" ] && [ ! -e "chiaki-ng-Win/${arg##*/}" ]; then echo "Copied $arg"; cp "$arg" chiaki-ng-Win/ ; echo "$arg" >> tmp0.txt; fi; done' || true
          done
          
          echo "Running windeployqt6..."
          windeployqt6.exe --verbose 0 --no-translations --qmldir=gui/src/qml chiaki-ng-Win/chiaki.exe
          
      - name: Package portable version
        run: |
          CHIAKI_VERSION_MAJOR="$(grep 'CHIAKI_VERSION_MAJOR' CMakeLists.txt | grep -Eo '[0-9]')"
          CHIAKI_VERSION_MINOR="$(grep 'CHIAKI_VERSION_MINOR' CMakeLists.txt | grep -Eo '[0-9]')"
          CHIAKI_VERSION_PATCH="$(grep 'CHIAKI_VERSION_PATCH' CMakeLists.txt | grep -Eo '[0-9]')"
          SHORT_SHA="${{ github.sha }}"
          SHORT_SHA="${SHORT_SHA:0:7}"
          RELEASE_PACKAGE_FILE="chiaki-ng-win_x64-v$CHIAKI_VERSION_MAJOR.$CHIAKI_VERSION_MINOR.$CHIAKI_VERSION_PATCH-${SHORT_SHA}.zip"
          zip -r $RELEASE_PACKAGE_FILE chiaki-ng-Win
          echo "RELEASE_PACKAGE_PATH=${RELEASE_PACKAGE_FILE}" >> $GITHUB_ENV
          echo "CHIAKI_VERSION=$CHIAKI_VERSION_MAJOR.$CHIAKI_VERSION_MINOR.$CHIAKI_VERSION_PATCH" >> $GITHUB_ENV
          
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: chiaki-ng-win_x64-v${{ env.CHIAKI_VERSION }}-portable
          path: ${{ env.RELEASE_PACKAGE_PATH }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0  # Уже заархивировано

      - name: Build summary
        run: |
          echo "## ✅ Build Successful!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ env.CHIAKI_VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Artifact:** ${{ env.RELEASE_PACKAGE_PATH }}" >> $GITHUB_STEP_SUMMARY

