name: Build cloud-streaming Linux

on:
  push:
    branches:
      - feature/cloud-linux
  pull_request:
    branches:
      - feature/cloud-linux
  workflow_dispatch:

jobs:
  build-appimage_x64:
    name: Build Linux AppImage x86_64
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Setup Podman
        run: |
          sudo apt-get update
          sudo apt-get -y install podman

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          path: chiaki-ng

      - name: Add QmlWebEngine Import
        working-directory: chiaki-ng
        run: |
          cp scripts/qtwebengine_import.qml gui/src/qml/

      - name: Run AppImage build
        working-directory: chiaki-ng
        run: |
          set -xe
          podman run --rm \
            -v "`pwd`:/build/chiaki" \
            -w "/build/chiaki" \
            --device /dev/fuse \
            --cap-add SYS_ADMIN \
            -t docker.io/streetpea/chiaki-ng-builder:qt6.9 \
            /bin/bash -c "sudo -E scripts/build-appimage.sh /build/appdir"
          cp appimage/chiaki-ng.AppImage appimage/chiaki-ng-linux_x86_64-cloud-streaming.AppImage

      - name: Upload chiaki-ng Artifact
        uses: actions/upload-artifact@v4
        with:
          name: chiaki-ng-linux_x86_64-cloud-streaming.AppImage
          path: chiaki-ng/appimage/chiaki-ng-linux_x86_64-cloud-streaming.AppImage
          if-no-files-found: error
          retention-days: 14
