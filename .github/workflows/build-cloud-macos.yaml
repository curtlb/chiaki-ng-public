name: Build cloud-streaming macOS

on:
  push:
    branches:
      - feature/cloud-macos
  pull_request:
    branches:
      - feature/cloud-macos
  workflow_dispatch:

jobs:
  build-mac_arm64:
    name: Build macOS Apple Silicon (arm64)
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install protobuf
        run: |
          pip3 install --user 'protobuf>=5,<6' --break-system-packages

      - name: Install brew dependencies
        env:
          HOMEBREW_NO_REQUIRE_TAP_TRUST: "1"
        run: |
          set -euo pipefail
          brew update
          brew uninstall pkgconfig || true
          TAP_DIR="$(brew --repository)/Library/Taps/streetpea/homebrew-streetpea"
          rm -rf "$TAP_DIR"
          mkdir -p "$(dirname "$TAP_DIR")"
          git clone --depth 1 https://github.com/streetpea/homebrew-streetpea.git "$TAP_DIR"
          # Newer Homebrew rejects the whole tap if a cask has invalid Linux stanzas.
          rm -f "$TAP_DIR"/Casks/*.rb
          brew trust streetpea/streetpea || true
          brew install --force 'streetpea/streetpea/chiaki-ng-qt@6' \
            ffmpeg pkgconf opus openssl cmake ninja nasm sdl2 protobuf@29 \
            speexdsp libplacebo wget python-setuptools json-c miniupnpc

      - name: Configure chiaki-ng
        run: |
          cmake -S . -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release \
            -DCHIAKI_ENABLE_CLI=OFF -DCHIAKI_ENABLE_STEAMDECK_NATIVE=OFF \
            -DCMAKE_PREFIX_PATH="$(brew --prefix)/opt/openssl@3;$(brew --prefix)/opt/chiaki-ng-qt@6;$(brew --prefix)/opt/protobuf@29"

      - name: Build chiaki-ng
        run: |
          export CPATH=$(brew --prefix)/opt/ffmpeg/include
          cmake --build build --config Release --clean-first --target chiaki

      - name: Deploy chiaki-ng
        run: |
          set -euo pipefail
          cp -a build/gui/chiaki.app chiaki-ng.app
          cp scripts/qtwebengine_import.qml gui/src/qml/
          QTBIN="$(brew --prefix)/opt/chiaki-ng-qt@6/bin"
          QTLIB="$(brew --prefix)/opt/chiaki-ng-qt@6/lib"
          "$QTBIN/macdeployqt" chiaki-ng.app -qmldir="$PWD/gui/src/qml" -libpath="$QTLIB"
          mkdir -p chiaki-ng.app/Contents/Resources/vulkan/icd.d
          curl -fsSL -o MoltenVK-macos.tar \
            https://github.com/KhronosGroup/MoltenVK/releases/download/v1.4.2/MoltenVK-macos.tar
          tar xf MoltenVK-macos.tar
          cp MoltenVK/MoltenVK/dylib/macOS/* chiaki-ng.app/Contents/Resources/vulkan/icd.d
          "$QTBIN/macdeployqt" chiaki-ng.app -qmldir="$PWD/gui/src/qml" -libpath="$QTLIB"
          if [[ -d chiaki-ng.app/Contents/Frameworks/QtWebEngineCore.framework/Helpers/QtWebEngineProcess.app ]]; then
            ln -sf ../../../../../../../Frameworks \
              chiaki-ng.app/Contents/Frameworks/QtWebEngineCore.framework/Helpers/QtWebEngineProcess.app/Contents
          fi
          ln -sf libvulkan.1.dylib chiaki-ng.app/Contents/Frameworks/vulkan
          codesign --force --entitlements gui/entitlements.xml --deep --sign - chiaki-ng.app
          rm -f chiaki-ng-macos_arm64-cloud-streaming.dmg
          hdiutil create -srcfolder chiaki-ng.app chiaki-ng-macos_arm64-cloud-streaming.dmg
          codesign --force --entitlements gui/entitlements.xml --deep --sign - chiaki-ng-macos_arm64-cloud-streaming.dmg

      - name: Upload chiaki-ng Artifact
        uses: actions/upload-artifact@v4
        with:
          name: chiaki-ng-macos_arm64-cloud-streaming.dmg
          path: chiaki-ng-macos_arm64-cloud-streaming.dmg
          if-no-files-found: error
          retention-days: 14

  build-mac_x86_64:
    name: Build macOS Intel (x86_64)
    runs-on: macos-15-intel
    permissions:
      contents: read
    env:
      # Match chiaki Intel deployment target (CMakeLists.txt).
      MACOSX_DEPLOYMENT_TARGET: "12.0"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install protobuf
        run: |
          pip3 install --user 'protobuf>=5,<6' --break-system-packages

      - name: Install brew dependencies
        env:
          HOMEBREW_NO_REQUIRE_TAP_TRUST: "1"
        run: |
          set -euo pipefail
          brew update
          brew uninstall pkgconfig || true
          TAP_DIR="$(brew --repository)/Library/Taps/streetpea/homebrew-streetpea"
          rm -rf "$TAP_DIR"
          mkdir -p "$(dirname "$TAP_DIR")"
          git clone --depth 1 https://github.com/streetpea/homebrew-streetpea.git "$TAP_DIR"
          # Newer Homebrew rejects the whole tap if a cask has invalid Linux stanzas.
          rm -f "$TAP_DIR"/Casks/*.rb
          brew trust streetpea/streetpea || true
          brew install --force 'streetpea/streetpea/chiaki-ng-qt@6' \
            ffmpeg pkgconf opus openssl cmake ninja nasm sdl2 protobuf@29 \
            speexdsp libplacebo wget python-setuptools json-c miniupnpc \
            meson shaderc vulkan-headers

      - name: Rebuild libplacebo for macOS 12 (no float to_chars)
        run: |
          set -euo pipefail
          # Brew bottles on macos-15 link std::to_chars(double/float), which only
          # exists in Apple libc++ from macOS 13.3+. Mac mini 2014 often runs 12.x
          # → dyld: Symbol not found: __ZNSt3__18to_charsEPcS0_d in libplacebo.
          PREFIX="${GITHUB_WORKSPACE}/deps-prefix"
          rm -rf libplacebo-src "$PREFIX"
          mkdir -p "$PREFIX"
          git clone --depth 1 --recursive https://github.com/haasn/libplacebo.git libplacebo-src
          cd libplacebo-src
          meson setup build --prefix="$PREFIX" --buildtype=release \
            -Ddefault_library=shared \
            -Dxxhash=disabled \
            -Ddemos=false \
            -Dtests=false \
            -Dvulkan=enabled \
            -Dopengl=disabled \
            -Dd3d11=disabled \
            -Dc_args="-mmacosx-version-min=${MACOSX_DEPLOYMENT_TARGET}" \
            -Dcpp_args="-mmacosx-version-min=${MACOSX_DEPLOYMENT_TARGET} -DHAS_STD_TO_CHARS_FP=0"
          meson compile -C build
          meson install -C build
          # Ensure float/double to_chars are not required at runtime.
          if nm -gU "$PREFIX"/lib/libplacebo*.dylib 2>/dev/null | grep -E 'to_charsEPcS0_[fd]'; then
            echo "::error::Rebuilt libplacebo still references float/double std::to_chars"
            nm -gU "$PREFIX"/lib/libplacebo*.dylib | grep to_chars || true
            exit 1
          fi
          echo "PKG_CONFIG_PATH=${PREFIX}/lib/pkgconfig:$(brew --prefix)/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "CMAKE_PREFIX_PATH=${PREFIX};$(brew --prefix)/opt/openssl@3;$(brew --prefix)/opt/chiaki-ng-qt@6;$(brew --prefix)/opt/protobuf@29" >> "$GITHUB_ENV"
          echo "Rebuilt libplacebo:"
          ls -la "$PREFIX"/lib/libplacebo*

      - name: Configure chiaki-ng
        run: |
          cmake -S . -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="${MACOSX_DEPLOYMENT_TARGET}" \
            -DCHIAKI_ENABLE_CLI=OFF -DCHIAKI_ENABLE_STEAMDECK_NATIVE=OFF \
            -DCMAKE_PREFIX_PATH="${CMAKE_PREFIX_PATH}"

      - name: Build chiaki-ng
        run: |
          export CPATH=$(brew --prefix)/opt/ffmpeg/include
          export LIBRARY_PATH="${GITHUB_WORKSPACE}/deps-prefix/lib:${LIBRARY_PATH:-}"
          cmake --build build --config Release --clean-first --target chiaki
      - name: Deploy chiaki-ng
        run: |
          set -euo pipefail
          PREFIX="${GITHUB_WORKSPACE}/deps-prefix"
          cp -a build/gui/chiaki.app chiaki-ng.app
          cp scripts/qtwebengine_import.qml gui/src/qml/
          QTBIN="$(brew --prefix)/opt/chiaki-ng-qt@6/bin"
          QTLIB="$(brew --prefix)/opt/chiaki-ng-qt@6/lib"
          "$QTBIN/macdeployqt" chiaki-ng.app -qmldir="$PWD/gui/src/qml" -libpath="$PREFIX/lib:$QTLIB"
          # Force-bundle the macOS-12-compatible libplacebo (overwrite brew bottle if any).
          mkdir -p chiaki-ng.app/Contents/Frameworks
          cp -f "$PREFIX"/lib/libplacebo*.dylib chiaki-ng.app/Contents/Frameworks/
          for dylib in chiaki-ng.app/Contents/Frameworks/libplacebo*.dylib; do
            [[ -f "$dylib" ]] || continue
            install_name_tool -id "@executable_path/../Frameworks/$(basename "$dylib")" "$dylib" || true
          done
          if nm -gU chiaki-ng.app/Contents/Frameworks/libplacebo*.dylib 2>/dev/null | grep -E 'to_charsEPcS0_[fd]'; then
            echo "::error::Bundled libplacebo still references float/double std::to_chars"
            exit 1
          fi
          mkdir -p chiaki-ng.app/Contents/Resources/vulkan/icd.d
          # Intel Iris / older Macs crash with MoltenVK 1.4.x (esp. Sequoia via OCLP).
          # Pin 1.2.9 which is known to work on Mac mini 2014-class GPUs.
          curl -fsSL -o MoltenVK-macos.tar \
            https://github.com/KhronosGroup/MoltenVK/releases/download/v1.2.9/MoltenVK-macos.tar
          tar xf MoltenVK-macos.tar
          # Layout differs slightly across MoltenVK releases.
          if [[ -d MoltenVK/MoltenVK/dylib/macOS ]]; then
            cp MoltenVK/MoltenVK/dylib/macOS/* chiaki-ng.app/Contents/Resources/vulkan/icd.d/
          elif [[ -d MoltenVK/dylib/macOS ]]; then
            cp MoltenVK/dylib/macOS/* chiaki-ng.app/Contents/Resources/vulkan/icd.d/
          else
            find MoltenVK -name 'libMoltenVK*' -print -exec cp {} chiaki-ng.app/Contents/Resources/vulkan/icd.d/ \;
            find MoltenVK -name 'MoltenVK_icd.json' -print -exec cp {} chiaki-ng.app/Contents/Resources/vulkan/icd.d/ \;
          fi
          # Help MoltenVK on unsupported/newer macOS versions on old hardware.
          /usr/libexec/PlistBuddy -c "Add :LSEnvironment dict" chiaki-ng.app/Contents/Info.plist 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :LSEnvironment:MVK_CONFIG_LIE_MACOSV string 14.8.1" chiaki-ng.app/Contents/Info.plist 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Set :LSEnvironment:MVK_CONFIG_LIE_MACOSV 14.8.1" chiaki-ng.app/Contents/Info.plist
          /usr/libexec/PlistBuddy -c "Add :LSEnvironment:QT_MTL_NO_TRANSACTION string 1" chiaki-ng.app/Contents/Info.plist 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Set :LSEnvironment:QT_MTL_NO_TRANSACTION 1" chiaki-ng.app/Contents/Info.plist
          "$QTBIN/macdeployqt" chiaki-ng.app -qmldir="$PWD/gui/src/qml" -libpath="$PREFIX/lib:$QTLIB"
          # macdeployqt may restore brew libplacebo — overwrite again.
          cp -f "$PREFIX"/lib/libplacebo*.dylib chiaki-ng.app/Contents/Frameworks/
          for dylib in chiaki-ng.app/Contents/Frameworks/libplacebo*.dylib; do
            [[ -f "$dylib" ]] || continue
            install_name_tool -id "@executable_path/../Frameworks/$(basename "$dylib")" "$dylib" || true
          done
          if [[ -d chiaki-ng.app/Contents/Frameworks/QtWebEngineCore.framework/Helpers/QtWebEngineProcess.app ]]; then
            ln -sf ../../../../../../../Frameworks \
              chiaki-ng.app/Contents/Frameworks/QtWebEngineCore.framework/Helpers/QtWebEngineProcess.app/Contents
          fi
          ln -sf libvulkan.1.dylib chiaki-ng.app/Contents/Frameworks/vulkan
          codesign --force --entitlements gui/entitlements.xml --deep --sign - chiaki-ng.app
          rm -f chiaki-ng-macos_x86_64-cloud-streaming.dmg
          hdiutil create -srcfolder chiaki-ng.app chiaki-ng-macos_x86_64-cloud-streaming.dmg
          codesign --force --entitlements gui/entitlements.xml --deep --sign - chiaki-ng-macos_x86_64-cloud-streaming.dmg

      - name: Upload chiaki-ng Artifact
        uses: actions/upload-artifact@v4
        with:
          name: chiaki-ng-macos_x86_64-cloud-streaming.dmg
          path: chiaki-ng-macos_x86_64-cloud-streaming.dmg
          if-no-files-found: error
          retention-days: 14
