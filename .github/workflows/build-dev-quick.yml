name: Quick Dev Build (Windows MSYS2)

# Супер-быстрая сборка только исполняемого файла для тестирования
# Без packaging, без DLL копирования, только chiaki.exe

on:
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip tests'
        required: false
        default: 'true'
        type: boolean

jobs:
  quick-build:
    name: Quick Dev Build
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    
    steps:
      - name: Disable autocrlf
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
          
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 1  # Shallow clone для скорости
          
      # Агрессивное кэширование MSYS2
      - name: Restore MSYS2 cache
        id: cache-msys2
        uses: actions/cache/restore@v4
        with:
          path: D:\a\_temp\msys64
          key: msys2-dev-${{ runner.os }}-v2
          
      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: mingw64
          update: false  # Ускорение - не обновляем
          install: git make unzip ccache
          pacboy: >-
            cc:p
            cmake:p
            curl:p
            fast_float:p
            fftw:p
            hidapi:p
            json-c:p
            lcms2:p
            libdovi:p
            meson:p
            miniupnpc:p
            ninja:p
            openssl:p
            opus:p
            pkgconf:p
            protobuf:p
            python:p
            python-pip:p
            qt6-base:p
            qt6-declarative:p
            qt6-svg:p
            SDL2:p
            shaderc:p
            speexdsp:p
            spirv-cross:p
            vulkan:p
            vulkan-headers:p
            
      # Сохраняем MSYS2 для следующих запусков
      - name: Save MSYS2 cache
        if: steps.cache-msys2.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: D:\a\_temp\msys64
          key: msys2-dev-${{ runner.os }}-v2
          
      - name: Install protobuf
        run: pip install protobuf
        
      # Кэш libplacebo
      - name: Restore libplacebo cache
        id: cache-libplacebo
        uses: actions/cache/restore@v4
        with:
          path: /mingw64/lib/libplacebo*
          key: libplacebo-${{ hashFiles('scripts/build-libplacebo-windows.sh') }}
          
      - name: Build libplacebo
        if: steps.cache-libplacebo.outputs.cache-hit != 'true'
        run: scripts/build-libplacebo-windows.sh
        
      - name: Save libplacebo cache
        if: steps.cache-libplacebo.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /mingw64/lib/libplacebo*
          key: libplacebo-${{ hashFiles('scripts/build-libplacebo-windows.sh') }}
          
      # Кэш FFmpeg (самый большой)
      - name: Restore FFmpeg cache
        id: cache-ffmpeg
        uses: actions/cache/restore@v4
        with:
          path: ffmpeg-cached
          key: ffmpeg-7.1-win64-gpl
          
      - name: Setup FFmpeg
        run: |
          if [ -d "ffmpeg-cached" ]; then
            echo "Using cached FFmpeg..."
            cp -a ffmpeg-cached/bin/. /mingw64/bin
            cp -a ffmpeg-cached/include/. /mingw64/include
            cp -a ffmpeg-cached/lib/. /mingw64/lib
          else
            echo "Downloading FFmpeg..."
            curl -LO https://github.com/streetpea/FFmpeg-Builds/releases/download/latest/ffmpeg-n7.1-latest-win64-gpl-shared-7.1.zip
            unzip -q ffmpeg-n7.1-latest-win64-gpl-shared-7.1.zip
            mkdir -p ffmpeg-cached
            cp -a "ffmpeg-n7.1-latest-win64-gpl-shared-7.1/bin/." ffmpeg-cached/bin
            cp -a "ffmpeg-n7.1-latest-win64-gpl-shared-7.1/include/." ffmpeg-cached/include
            cp -a "ffmpeg-n7.1-latest-win64-gpl-shared-7.1/lib/." ffmpeg-cached/lib
            cp -a ffmpeg-cached/bin/. /mingw64/bin
            cp -a ffmpeg-cached/include/. /mingw64/include
            cp -a ffmpeg-cached/lib/. /mingw64/lib
          fi
          
      - name: Save FFmpeg cache
        if: steps.cache-ffmpeg.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ffmpeg-cached
          key: ffmpeg-7.1-win64-gpl
          
      # Кэш для third-party библиотек
      - name: Restore third-party build cache
        uses: actions/cache/restore@v4
        with:
          path: build/third-party
          key: build-third-party-${{ runner.os }}-${{ hashFiles('third-party/**') }}
          restore-keys: |
            build-third-party-${{ runner.os }}-
            
      # Кэш ccache
      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-dev-${{ github.sha }}
          restore-keys: |
            ccache-dev-
            
      - name: Configure chiaki-ng
        run: |
          cmake -S . -B build -G "Ninja" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCHIAKI_ENABLE_CLI=OFF \
            -DCMAKE_PREFIX_PATH="/mingw64" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
            
      - name: Build chiaki-ng (максимально параллельно)
        run: |
          ccache -s
          cmake --build build --config Release --target chiaki -j $(nproc)
          ccache -s
          
      - name: Save build caches
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            build/third-party
            .ccache
          key: |
            build-cache-${{ github.sha }}
            
      # Минимальный package - только EXE
      - name: Upload executable only
        uses: actions/upload-artifact@v4
        with:
          name: chiaki-ng-dev-${{ github.sha }}
          path: build/gui/chiaki.exe
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
          
      - name: Build Info
        shell: pwsh
        run: |
          echo "## 🚀 Quick Dev Build Complete!" >> $env:GITHUB_STEP_SUMMARY
          echo "" >> $env:GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $env:GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $env:GITHUB_STEP_SUMMARY
          echo "" >> $env:GITHUB_STEP_SUMMARY
          echo "### ⚡ Optimizations Used:" >> $env:GITHUB_STEP_SUMMARY
          echo "- ✅ Cached MSYS2 packages" >> $env:GITHUB_STEP_SUMMARY
          echo "- ✅ Cached libplacebo" >> $env:GITHUB_STEP_SUMMARY
          echo "- ✅ Cached FFmpeg 7.1" >> $env:GITHUB_STEP_SUMMARY
          echo "- ✅ Cached third-party builds" >> $env:GITHUB_STEP_SUMMARY
          echo "- ✅ CCCache enabled" >> $env:GITHUB_STEP_SUMMARY
          echo "- ✅ Parallel build (-j $(nproc))" >> $env:GITHUB_STEP_SUMMARY
          echo "" >> $env:GITHUB_STEP_SUMMARY
          echo "⚠️ **Note:** Executable only, dependencies not included" >> $env:GITHUB_STEP_SUMMARY

